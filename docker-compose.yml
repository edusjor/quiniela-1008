services:
  postgres:
    image: postgres:16
    container_name: quiniela1008_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - quiniela1008_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: quiniela1008_api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      PORT: 6371
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /backend
    container_name: quiniela1008_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /backend
    depends_on:
      api:
        condition: service_started
    ports:
      - "6371:8371"

volumes:
  quiniela1008_pg_data:
