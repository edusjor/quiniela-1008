services:
  postgres:
    image: postgres:16
    container_name: q1008cam26_pg_31415
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - q1008cam26_pg_data_31415:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: q1008cam26_api_31415
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      PORT: 17643
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /backend
    container_name: q1008cam26_web_31415
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /backend
    depends_on:
      api:
        condition: service_started
    ports:
      - "19631:18931"

volumes:
  q1008cam26_pg_data_31415:
